services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview-postgres
    environment:
      POSTGRES_USER: interview
      POSTGRES_PASSWORD: interview
      POSTGRES_DB: interview
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview -d interview"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: interview-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: interview-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - mongo

volumes:
  pgdata:
  mongodata:
