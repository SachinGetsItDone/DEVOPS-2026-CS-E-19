name: Build React + Vite Client

# Triggers: Runs automatically on every push and allows manual triggering from the Actions tab
on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build Frontend (Client)
    runs-on: ubuntu-latest

    # Set the working directory for all run steps to the client folder
    defaults:
      run:
        working-directory: client

    steps:
      # Step 1: Check out the project source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Node.js 20 with npm caching for faster builds
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      # Step 3: Install clean dependencies matching package-lock.json
      - name: Install dependencies
        run: npm ci

      # Step 4: Run the Vite production build
      - name: Build client application
        run: npm run build

      # Step 5: Display clear success confirmation
      - name: Confirm Build Success
        if: success()
        run: echo "Build succeeded! React + Vite client compiled cleanly."
